<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specimen — a clip as a 2.5D parallax object</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(120% 90% at 50% 20%, #0b1118 0%, #05070a 60%, #020304 100%);
        color: #cfd8e3; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow: hidden;
      }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .top {
        position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 12px; align-items: baseline;
        padding: 10px 16px; pointer-events: none;
        background: linear-gradient(to bottom, rgba(2,3,4,.72), transparent);
      }
      .top b { letter-spacing: .18em; font-size: 12px; color: #8fa3b8; white-space: nowrap; }
      .top #info { color: #e8eef4; }
      .top #meta-story { margin-left: auto; font-size: 12px; color: #7d8fa3; }
      .dock {
        position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; gap: 10px; align-items: center; padding: 8px 14px;
        background: rgba(8,12,17,.78); border: 1px solid #1c2632; border-radius: 10px;
        max-width: min(92vw, 760px);
      }
      .dock button {
        background: #141c26; color: #e8eef4; border: 1px solid #2a3746; border-radius: 8px;
        width: 38px; height: 32px; font-size: 14px; cursor: pointer;
      }
      .dock button:hover { background: #1c2634; }
      .dock button[aria-pressed="true"] { border-color: #58c4dc; color: #9be3f5; }
      .dock input[type="range"] { width: min(38vw, 320px); accent-color: #58c4dc; }
      .dock output { font-variant-numeric: tabular-nums; color: #9fb2c6; min-width: 92px; text-align: right; }
      .dock .plate-badge {
        font-size: 11px; color: #9fd8a8; border: 1px solid #2c4a34; border-radius: 20px;
        padding: 2px 10px; white-space: nowrap;
      }
      .keys { position: fixed; bottom: 16px; right: 16px; font-size: 12px; color: #5f7387; margin: 0; }
      .keys kbd { border: 1px solid #2a3746; border-radius: 4px; padding: 0 5px; font-size: 11px; }
      .fail {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: #14090b; border: 1px solid #6e2a33; color: #f3c1c7;
        padding: 18px 22px; border-radius: 10px; max-width: min(90vw, 480px);
      }
      body.embed .top, body.embed .dock, body.embed .keys { display: none; }
      body.embed { overflow: hidden; }
      @media (max-width: 640px) {
        .top #meta-story { display: none; }
        .keys { display: none; }
        .dock output { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <header class="top">
      <b>SPECIMEN</b>
      <span id="info">loading…</span>
      <span id="meta-story"></span>
    </header>

    <div class="dock" role="group" aria-label="Playback">
      <button id="play" type="button" aria-label="Play or pause">❚❚</button>
      <button id="trail" type="button" aria-label="Toggle ghost trail" aria-pressed="false" title="Ghost trail (t)">👻</button>
      <input id="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="Specimen time" />
      <output id="clock">0.00s</output>
      <span class="plate-badge" id="plateBadge"></span>
    </div>
    <p class="keys"><kbd>drag</kbd> slide · <kbd>scroll</kbd> time · <kbd>space</kbd> play · <kbd>t</kbd> trail</p>
    <div class="fail" id="fail" hidden></div>

    <script type="importmap">
      { "imports": { "three": "./vendor/three/build/three.module.js" } }
    </script>
    <script type="module" src="view-basic.js"></script>
  </body>
</html>
