<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Water bear — every 3.5D / 4D view of one river crossing</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="lab.css" />
    <style>
      html, body { height: 100%; }
      body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
      .shell { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
      nav { overflow-y: auto; border-right: 1px solid var(--line); padding: 14px 0 24px; }
      nav button {
        display: block; width: 100%; text-align: left; padding: 12px 20px 12px 18px;
        background: none; border: 0; border-left: 3px solid transparent; color: var(--muted);
        font: inherit; cursor: pointer;
      }
      nav button:hover { background: rgba(238, 232, 220, 0.04); }
      nav button[aria-selected="true"] { border-left-color: var(--glow); background: rgba(255, 217, 168, 0.07); color: var(--ink); }
      nav b { display: block; color: var(--ink); font-weight: 600; }
      nav .tag { font: 11px var(--mono); letter-spacing: 0.1em; color: var(--glow); }
      nav small { display: block; margin-top: 4px; color: var(--dim); line-height: 1.45; }
      .stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr; }
      .stage header { display: flex; gap: 16px; align-items: baseline; padding: 10px 18px; border-bottom: 1px solid var(--line); }
      .stage header span { color: var(--muted); flex: 1; }
      .stage header a { font: 12px var(--mono); }
      iframe { width: 100%; height: 100%; border: 0; background: #000; }
      .loading { position: absolute; inset: 44px 0 0 0; display: grid; place-items: center; color: var(--dim); font: 12px var(--mono); pointer-events: none; }
      .loading[hidden] { display: none; }
      @media (max-width: 800px) {
        .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 0; }
        nav button { white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; }
        nav button[aria-selected="true"] { border-bottom-color: var(--glow); }
        nav small { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="title">
        <b>WATER BEAR</b>
        <span>one grizzly crossing a river, seen every way we can build it</span>
      </div>
      <div></div>
      <div class="verdict" id="verdict"></div>
    </header>

    <div class="shell">
      <nav id="tabs" role="tablist" aria-label="Views of the water bear"></nav>
      <section class="stage">
        <header>
          <b id="stageTitle"></b>
          <span id="stageNote"></span>
          <a id="stageOpen" href="#" target="_blank" rel="noopener">open on its own ↗</a>
        </header>
        <iframe id="frame" title="View" allow="fullscreen"></iframe>
        <div class="loading" id="loading">loading…</div>
      </section>
    </div>

    <script type="module" src="bear.js"></script>
  </body>
</html>
